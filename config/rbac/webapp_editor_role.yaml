# This rule is not used by the project kube-deploy itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the core.cafeco.in.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-deploy
    app.kubernetes.io/managed-by: kustomize
  name: webapp-editor-role
rules:
- apiGroups:
  - core.cafeco.in
  resources:
  - webapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.cafeco.in
  resources:
  - webapps/status
  verbs:
  - get
